<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Now</title>
    <style>
        @import url('https://googleapis.com');
        *{padding: 0;margin: 0;box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;}
        ul{list-style: none;} a{text-decoration: none ; color: white;}
        .container{
            background-color:#002758 ;
            padding:15px 100px;
        }
        .nav-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 100px;
            border-radius: 5px;
            border-bottom: 1px solid black;
            
        }
        .nav-bar .menu{
            display: flex;
            align-items: center;
            padding: 15px 100px;
            gap: 100px;
        }
        .container-1{
            position: relative;
            width: 100%;
            min-height: 600px;
            background-image: url(./images/bg-image.jpg);
            background-position: center;
            background-size: cover;
        }
        .container-1 .login-page-in{
            position:absolute;
            width: 400px;
            height: 400px;
            margin: 150px;
            border-radius: 20px;
            background:rgba(255, 255, 255,0.10);
        }
        .container-1 .login{
            padding: 70px;
        }
        .container-1 .login tr{
            text-align: center;
        }
        input[type="text"]{
            display: block;
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            text-align: center;
            color: white;
            border: none;
            background: rgba(0, 0, 0, 0.25);
        }
        input[type="password"]{
            display: block;
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            text-align: center;
            color: white;
            border: none;
            background: rgba(0, 0, 0, 0.25);
        }
        .login label{
            color:white;
            margin-bottom: 10px;
        }
        .login .btn{
            margin: 30px;
            margin-left: 80px;
            padding: 10px;
            width: 100px;
            border-radius: 10px;
            border: none;
        }
        .btn:hover{
            color: white;
            border: 1px solid white;
            background-color: #002758;
        }
        .container-3 {
            display: flex;
            margin-top: 2%;
            width:100%;
            height: 400px;
            gap:0.8em;
        }
        .container-3 img{
            width: 500px;
            height: 500px;
            box-shadow:rgba(255, 255, 255,0.10);
        }
         .card-1{
            width: 510px;
            height: 600px;
            box-shadow:rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="nav-bar">
                <h1><a href="index.html">Shop Now</a></h1>
                <ul class="menu">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Shopping</a></li>
                    <li><a href="#">Features</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </div>
        </div>
    </header>
    <section class="container-1">
            <div class="login-page-in">
                <div class="login">
                    <form action="submit">
                       <table>
                        <tr>
                            <td><label for="">Customer Name:</label></td>
                        </tr>
                        <tr>
                            <td><input type="text" name="cname"></td>
                        </tr>
                        <tr>
                            <td><label for="">Customer Password:</label></td>
                        </tr>
                        <tr>
                            <td><input type="password" name="cname"></td>
                        </tr>
                       </table>
                       <button class="btn">Login</button>
                    </form>
                </div>
                </div>
    </section>
    <div class="container-3">
        <div class="card-1">
            <img src="./images/01.png" alt="icon">
            <h6>Brand New Shirt</h6>
        </div>
        <div class="card-2">
            <img src="./images/02.png" alt="icon">
        </div>
        <div class="card-3">
            <img src="./images/03.png" alt="icon">
        </div>
    </div>
    
</body>
</html>
