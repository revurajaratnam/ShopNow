<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Now</title>
    <style>
        @import url('https://googleapis.com');
        *{padding: 0;margin: 0;box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;}
        ul{list-style: none;} a{text-decoration: none ; color: white;}
        .container{
            background-color:#002758 ;
            padding:15px 100px;
        }
        .nav-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 100px;
            border-radius: 5px;
            border-bottom: 1px solid black;
            
        }
        .nav-bar .menu{
            display: flex;
            align-items: center;
            padding: 15px 100px;
            gap: 100px;
        }
        .container-1{
            position: relative;
            width: 100%;
            min-height: 600px;
            background-image: url(./images/bg-image.jpg);
            background-position: center;
            background-size: cover;
        }
        .container-1 .login-page-in{
            position:absolute;
            width: 400px;
            height: 400px;
            margin: 150px;
            border-radius: 20px;
            background:rgba(255, 255, 255,0.10);
        }
        .container-1 .login{
            padding: 70px;
        }
        .container-1 .login tr{
            text-align: center;
        }
        input[type="text"]{
            display: block;
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            text-align: center;
            color: white;
            border: none;
            background: rgba(0, 0, 0, 0.25);
        }
        input[type="password"]{
            display: block;
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            text-align: center;
            color: white;
            border: none;
            background: rgba(0, 0, 0, 0.25);
        }
        .login label{
            color:white;
            margin-bottom: 10px;
        }
        .login .btn{
            margin: 30px;
            margin-left: 80px;
            padding: 10px;
            width: 100px;
            border-radius: 10px;
            border: none;
        }
        .btn:hover{
            color: white;
            border: 1px solid white;
            background-color: #002758;
        }
        .container-3 {
            display: flex;
            margin-top: 2%;
            width:100%;
            height: 800px;
            gap:0.8em;
            text-align: center;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .container-3 .card-4{
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: auto;
        }
        
        .container-3 .card-1 .product-img{
            width: 500px;
            height: 500px;
            box-shadow:rgba(255, 255, 255,0.10);
        }
        .card-2  .product-img{
            width: 500px;
            height: 500px;
            box-shadow:rgba(255, 255, 255,0.10);
        }
        .card-3  .product-img{
            width: 500px;
            height: 500px;
            box-shadow:rgba(255, 255, 255,0.10);
        }
        .container-3 .card-4  .product-img{
            width: 200px;
            height: 420px;
            box-shadow:rgba(255, 255, 255,0.10);
        }
        .card-5  .product-img{
            width: 500px;
            height: 500px;
            box-shadow:rgba(255, 255, 255,0.10);
        }
        .card-6  .product-img{
            width: 500px;
            height: 500px;
            box-shadow:rgba(255, 255, 255,0.10);
        }
        h1{
            font-weight: normal;
        }
        p{
            font-weight: bolder;
            font-size: 3em;
        }
        .container-3 .text{
            text-align:center

        }
        .container-3 .strike{
            color: red;
            font-size: 0.5em;
        }
        .container-3 .cart{
            margin-left: 3em;
            font-size: 2em;
            width: 10em;
            padding: 10px;
            border: none;
            border-radius: 0.5em;
            background: greenyellow;
        }
        .container-3 .cart:hover{
            color:white;
            background: green;
        }
        .summer-sale{
            position: relative;
            width: 100%;
            height: 400px;
        }
         .summer-sale .sale-image {
            position: absolute;
            width: 100%;
            height: 400px;
        }
        .container-4{
            display: flex;
            margin-top: 2%;
            width: 100%;
            height: 400px;
            overflow-x: auto;
            scrollbar-width: none;
            overflow-y: hidden;
           
        }
        .container-4 .card01{
            width: 500px;
            height: 500px;
        }
        .container-4 .cc4{
            display: flex;
            width: 500px;
            height: 300px;
        }
        .container-4 .mac{
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="nav-bar">
                <h1><a href="index.html">Shop Now</a></h1>
                <ul class="menu">
                    <li><a href="#">Home</a></li>
                    <li><a href="#shop">Shopping</a></li>
                    <li><a href="#">Features</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </div>
        </div>
    </header>
    <section class="container-1">
            <div class="login-page-in">
                <div class="login">
                    <form action="submit">
                       <table>
                        <tr>
                            <td><label for="">Customer Name:</label></td>
                        </tr>
                        <tr>
                            <td><input type="text" name="cname"></td>
                        </tr>
                        <tr>
                            <td><label for="">Customer Password:</label></td>
                        </tr>
                        <tr>
                            <td><input type="password" name="cname"></td>
                        </tr>
                       </table>
                       <button class="btn">Login</button>
                    </form>
                </div>
                </div>
    </section>
    <div class="container-3" id="shop">
        <div class="card-1">
          <label for="zoom">
            <img src="./images/01.png" alt="icon" class="product-img">
          </label>
            <h1 class="text">Brand New Shirt</h1>
            <p class="text">1499-/ <s class="strike">2499-/</s></p>
            <button class="cart">ADD TO CART</button>
        </div>
        <div class="card-2">
            <label for="zoom">
                <img src="./images/02.png" alt="icon" class="product-img">
            </label>
            <h1 class="text">Gray Hoodie</h1>
            <p class="text">2199-/ <s class="strike">3999-/</s></p>
            <button class="cart">ADD TO CART</button>
        </div>
        <div class="card-3">
            <label for="zoom">
            <img src="./images/03.png" alt="icon" class="product-img">
            </label>
            <h1 class="text">Black Hoodie</h1>
            <p class="text">1999-/ <s class="strike">4999-/</s></p>
            <button class="cart">ADD TO CART</button>
        </div>
        <div class="card-4">
            <label for="zoom">
            <img src="./images/04.png" alt="icon" class="product-img">
            </label>
            <h1 class="text">Light Jeans</h1>
            <p class="text">1119-/ <s class="strike">1999-/</s></p>
            <button class="cart">ADD TO CART</button>
        </div>
        <div class="card-5">
            <label for="zoom">
            <img src="./images/05.png" alt="icon" class="product-img">
            </label>
            <h1 class="text">Dark-Jeans</h1>
            <p class="text">999-/ <s class="strike">1499-/</s></p>
            <button class="cart">ADD TO CART</button>
        </div>
        <div class="card-6">
            <label for="zoom">
            <img src="./images/06.png" alt="icon" class="product-img">
            </label>
            <h1 class="text">Jeans</h1>
            <p class="text">1499-/ <s class="strike">2499-/</s></p>
            <button class="cart">ADD TO CART</button>
        </div>
    </div>
    <div class="summer-sale">
        <div class="adjust"><img src="./images/sale.jpg" alt="" class="sale-image"></div>
    </div>
    <div class="container-4">
        <div class="card01">
            <img src="./images/1.png" alt="" class="cc4">
          <h1 class="mac">Mac Book pro</h1>
        </div>
        <div class="card01">
            <img src="./images/2.png" alt="" class="cc4">
          <h1 class="mac">Asus Zen Book</h1>
        </div>
        <div class="card01">
            <img src="./images/3.png" alt="" class="cc4">
          <h1 class="mac">Dell G15 </h1>
        </div>
        <div class="card01">
            <img src="./images/1.png" alt="" class="cc4">
          <h1 class="mac">Mac Book pro</h1>
        </div>
    </div>
</body>
</html>
